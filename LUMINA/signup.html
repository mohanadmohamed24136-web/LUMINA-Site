<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | LUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: { cyan: "#00F0FF", magenta: "#FF00AA", gold: "#FFD700" }, dark: { bg: "#050505", card: "rgba(20, 20, 20, 0.7)", border: "rgba(255, 255, 255, 0.1)" } } } }
        }
    </script>
</head>
<body class="dark overflow-x-hidden min-h-screen flex items-center justify-center p-6 relative w-full">
    <!-- Theme Toggle Floating -->
    <button onclick="toggleTheme()" class="fixed top-8 right-8 w-12 h-12 glass rounded-2xl flex items-center justify-center text-primary-gold z-50 hover:scale-110 transition-all">
        <i data-lucide="sun" class="theme-icon w-6 h-6"></i>
    </button>

    <!-- Mesh Background -->
    <div class="bg-mesh"></div>

    <!-- Background Accents -->
    <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none opacity-30">
        <div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] bg-primary-magenta rounded-full blur-[200px] animate-float"></div>
        <div class="absolute -bottom-1/4 -left-1/4 w-[800px] h-[800px] bg-primary-gold rounded-full blur-[200px] animate-float" style="animation-delay: -2s"></div>
    </div>

    <div id="signup-container" class="max-w-3xl w-full glass p-1.5 md:p-2 rounded-3xl md:rounded-[3.5rem] border border-white/10 shadow-[0_50px_100px_-20px_rgba(0,0,0,0.6)] relative overflow-hidden animate-fade-in group mx-auto">
        <div class="bg-black/40 rounded-[1.5rem] md:rounded-[3rem] p-6 md:p-14 space-y-8 md:space-y-10 relative overflow-hidden text-center">
            <!-- Glow Accent -->
            <div class="absolute -top-20 -left-20 w-40 h-40 bg-primary-magenta/20 blur-[50px] rounded-full group-hover:bg-primary-magenta/30 transition-all duration-700"></div>
            
            <!-- Logo -->
            <div class="flex justify-center mb-4 md:mb-6">
                <a href="index.html" class="flex items-center gap-2 md:gap-3 group/logo">
                    <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-primary-cyan to-primary-magenta rounded-lg md:rounded-xl flex items-center justify-center group-hover/logo:rotate-12 transition-transform">
                        <i data-lucide="sparkles" class="w-5 h-5 md:w-6 md:h-6 text-white"></i>
                    </div>
                    <span class="luxury-title text-2xl md:text-3xl bg-gradient-to-r from-primary-cyan via-primary-magenta to-primary-gold bg-clip-text text-transparent">LUMINA</span>
                </a>
            </div>

            <!-- Tabs -->
            <div class="flex p-1 bg-white/5 rounded-xl md:rounded-2xl mb-4 md:mb-6 max-w-sm mx-auto border border-white/5">
                <a href="login.html" class="flex-1 py-2.5 md:py-3 rounded-lg md:rounded-xl text-gray-500 hover:text-white font-black text-[10px] md:text-xs uppercase tracking-widest transition-all">Login</a>
                <button class="flex-1 py-2.5 md:py-3 rounded-lg md:rounded-xl bg-primary-cyan text-black font-black text-[10px] md:text-xs uppercase tracking-widest shadow-lg shadow-primary-cyan/20">Create Account</button>
            </div>

            <form class="space-y-6 md:space-y-8 text-left">
                <!-- User Type Toggle -->
                <div class="space-y-3 md:space-y-4 glass p-4 md:p-6 rounded-2xl md:rounded-3xl border border-white/5 max-w-md mx-auto">
                    <div class="flex justify-between items-center px-2">
                        <label class="luxury-subtitle">Account Type</label>
                        <span id="role-label" class="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-primary-cyan">Customer</span>
                    </div>
                    
                    <div class="relative flex items-center bg-white/5 p-1 rounded-xl md:rounded-2xl h-12 md:h-14 cursor-pointer select-none" onclick="toggleRole()">
                        <!-- Sliding Indicator -->
                        <div id="role-slider" class="absolute left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-primary-cyan rounded-lg md:rounded-xl transition-all duration-500 shadow-lg shadow-primary-cyan/20"></div>
                        
                        <!-- Options -->
                        <div class="relative z-10 flex-1 text-center">
                            <span id="label-customer" class="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-black transition-colors duration-500">Customer</span>
                        </div>
                        <div class="relative z-10 flex-1 text-center">
                            <span id="label-designer" class="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-gray-500 transition-colors duration-500">Designer</span>
                        </div>
                    </div>
                    <input type="hidden" id="user-role" name="role" value="customer">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 md:gap-x-8 gap-y-4 md:gap-y-6">
                    <div class="space-y-1.5 md:space-y-2 group/input">
                        <label class="luxury-subtitle ml-3 md:ml-4">Full Name</label>
                        <input type="text" id="username" placeholder="Enter your name" required 
                            class="w-full bg-white/5 border border-white/5 rounded-xl md:rounded-2xl py-3.5 md:py-4 px-5 md:px-6 focus:bg-white/10 focus:border-primary-cyan/30 transition-all outline-none text-xs md:text-sm font-bold placeholder:text-white/20">
                    </div>

                    <div class="space-y-1.5 md:space-y-2 group/input">
                        <label class="luxury-subtitle ml-3 md:ml-4">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required 
                            class="w-full bg-white/5 border border-white/5 rounded-xl md:rounded-2xl py-3.5 md:py-4 px-5 md:px-6 focus:bg-white/10 focus:border-primary-cyan/30 transition-all outline-none text-xs md:text-sm font-bold placeholder:text-white/20">
                        <p id="email-hint" class="text-[7px] md:text-[8px] font-bold text-red-500/0 ml-3 md:ml-4 uppercase tracking-widest transition-all">Invalid email architecture</p>
                    </div>
                    
                    <div class="space-y-1.5 md:space-y-2 group/input">
                        <label class="luxury-subtitle ml-3 md:ml-4">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required 
                            class="w-full bg-white/5 border border-white/5 rounded-xl md:rounded-2xl py-3.5 md:py-4 px-5 md:px-6 focus:bg-white/10 focus:border-primary-cyan/30 transition-all outline-none text-xs md:text-sm font-bold placeholder:text-white/20">
                        <p id="pass-hint" class="text-[7px] md:text-[8px] font-bold text-red-500/0 ml-3 md:ml-4 uppercase tracking-widest transition-all">Identity key too short</p>
                    </div>

                    <div class="space-y-1.5 md:space-y-2 group/input">
                        <label class="luxury-subtitle ml-3 md:ml-4">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm password" required 
                            class="w-full bg-white/5 border border-white/5 rounded-xl md:rounded-2xl py-3.5 md:py-4 px-5 md:px-6 focus:bg-white/10 focus:border-primary-cyan/30 transition-all outline-none text-xs md:text-sm font-bold placeholder:text-white/20">
                        <p id="confirm-hint" class="text-[7px] md:text-[8px] font-bold text-red-500/0 ml-3 md:ml-4 uppercase tracking-widest transition-all">Keys do not match</p>
                    </div>

                    <div class="space-y-1.5 md:space-y-2 group/input md:col-span-2">
                        <label class="luxury-subtitle ml-3 md:ml-4">Location Access</label>
                        <div class="flex gap-2">
                            <input type="text" id="address" placeholder="Auto-detect or enter address" required 
                                class="flex-1 bg-white/5 border border-white/5 rounded-xl md:rounded-2xl py-3.5 md:py-4 px-5 md:px-6 focus:bg-white/10 focus:border-primary-cyan/30 transition-all outline-none text-xs md:text-sm font-bold placeholder:text-white/20">
                            <button type="button" onclick="detectLocation()" class="w-12 h-12 md:w-14 md:h-14 bg-white/5 border border-white/5 rounded-xl md:rounded-2xl flex items-center justify-center hover:bg-primary-cyan hover:text-black transition-all">
                                <i data-lucide="map-pin" class="w-4 h-4 md:w-5 md:h-5"></i>
                            </button>
                        </div>
                        <input type="hidden" id="latitude">
                        <input type="hidden" id="longitude">
                    </div>
                </div>

                <div class="flex justify-center pt-2 md:pt-4">
                    <button type="submit" class="btn-premium max-w-md w-full bg-primary-cyan text-black font-black py-4 md:py-5 rounded-xl md:rounded-2xl flex items-center justify-center space-x-3 active:scale-[0.98] transition-all shadow-2xl">
                        <span class="uppercase tracking-[0.2em] text-[10px] md:text-xs">Join LUMINA</span>
                    </button>
                </div>
            </form>

            <div class="text-center pt-6 border-t border-white/5">
                <p class="luxury-subtitle leading-relaxed">
                    Already have an account? <a href="login.html" class="text-primary-cyan hover:underline ml-2">Sign in</a>
                </p>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script>
        // Ensure Lucide is loaded
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }

            // Redirect if already logged in
            if (getCookie('userId')) {
                window.location.href = 'index.html';
            }

            // Live Validation
            const emailInp = document.getElementById('email');
            const passInp = document.getElementById('password');
            const confirmInp = document.getElementById('confirm-password');

            emailInp.addEventListener('input', () => {
                const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInp.value);
                const hint = document.getElementById('email-hint');
                if (emailInp.value && !isValid) {
                    hint.classList.remove('text-red-500/0');
                    hint.classList.add('text-red-500');
                } else {
                    hint.classList.add('text-red-500/0');
                    hint.classList.remove('text-red-500');
                }
            });

            passInp.addEventListener('input', () => {
                const hint = document.getElementById('pass-hint');
                if (passInp.value && passInp.value.length < 6) {
                    hint.classList.remove('text-red-500/0');
                    hint.classList.add('text-red-500');
                } else {
                    hint.classList.add('text-red-500/0');
                    hint.classList.remove('text-red-500');
                }
            });

            confirmInp.addEventListener('input', () => {
                const hint = document.getElementById('confirm-hint');
                if (confirmInp.value && confirmInp.value !== passInp.value) {
                    hint.classList.remove('text-red-500/0');
                    hint.classList.add('text-red-500');
                } else {
                    hint.classList.add('text-red-500/0');
                    hint.classList.remove('text-red-500');
                }
            });
        });

        // Toggle Function for Switch
        window.toggleRole = function() {
            const roleInput = document.getElementById('user-role');
            const slider = document.getElementById('role-slider');
            const labelCustomer = document.getElementById('label-customer');
            const labelDesigner = document.getElementById('label-designer');
            const roleLabel = document.getElementById('role-label');
            
            if (roleInput.value === 'customer') {
                // Switch to Designer
                roleInput.value = 'designer';
                slider.style.left = 'calc(50% + 1px)';
                slider.style.background = '#FF00AA'; // Magenta for Designer
                slider.style.boxShadow = '0 10px 20px -5px rgba(255, 0, 170, 0.4)';
                
                labelCustomer.style.color = '#6b7280'; // gray-500
                labelDesigner.style.color = '#000000'; // black
                
                roleLabel.textContent = 'Designer';
                roleLabel.style.color = '#FF00AA';
            } else {
                // Switch to Customer
                roleInput.value = 'customer';
                slider.style.left = '4px';
                slider.style.background = '#00F0FF'; // Cyan for Customer
                slider.style.boxShadow = '0 10px 20px -5px rgba(0, 240, 255, 0.4)';
                
                labelCustomer.style.color = '#000000'; // black
                labelDesigner.style.color = '#6b7280'; // gray-500
                
                roleLabel.textContent = 'Customer';
                roleLabel.style.color = '#00F0FF';
            }
            console.log('Role Grid Toggled:', roleInput.value);
        };

        window.detectLocation = function() {
            if (!navigator.geolocation) {
                showToast('Geolocation is not supported by your browser', 'error');
                return;
            }

            const btn = document.querySelector('button[onclick="detectLocation()"]');
            btn.classList.add('animate-pulse');
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                document.getElementById('latitude').value = lat;
                document.getElementById('longitude').value = lon;

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await response.json();
                    document.getElementById('address').value = data.display_name;
                    showToast('Location Detected Successfully!');
                } catch (err) {
                    document.getElementById('address').value = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                } finally {
                    btn.classList.remove('animate-pulse');
                }
            }, (err) => {
                showToast('Location Access Denied', 'error');
                btn.classList.remove('animate-pulse');
            });
        };

        // Form Submission Logic
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const role = document.getElementById('user-role').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const address = document.getElementById('address').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;

            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            try {
                const signupData = { username, email, password, role, address, latitude, longitude };
                
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signupData)
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(currentLang === 'ar' ? 'تم إنشاء الهوية بنجاح! راجع بريدك الإلكتروني' : 'LUMINA Identity Initialized! Check your email.', 'success');
                    
                    // Improved Dev Helper on the side (Bottom Right)
                    if (data.devLink) {
                        const devHelper = document.createElement('div');
                        devHelper.className = 'fixed bottom-8 right-8 z-[500] glass p-8 rounded-[2.5rem] border border-primary-cyan/30 w-80 animate-slide-up shadow-[0_20px_60px_rgba(0,0,0,0.8)] text-center space-y-5';
                        devHelper.innerHTML = `
                            <div class="w-12 h-12 bg-primary-cyan/10 border border-primary-cyan/20 text-primary-cyan rounded-2xl flex items-center justify-center mx-auto mb-2">
                                <i data-lucide="shield-alert" class="w-6 h-6"></i>
                            </div>
                            <div class="space-y-1">
                                <h3 class="text-sm font-black uppercase tracking-tighter text-white">Debug Protocol: Active</h3>
                                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest leading-relaxed">Verification link generated. Use the link below if email delivery is delayed.</p>
                            </div>
                            <a href="${data.devLink}" class="block w-full bg-primary-cyan text-black py-3.5 rounded-xl font-black text-[9px] uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary-cyan/20">
                                Verify Account Now
                            </a>
                            <button onclick="this.parentElement.remove()" class="text-[8px] font-black text-gray-700 uppercase tracking-widest hover:text-white transition-colors pt-2 block mx-auto">
                                Terminate Helper
                            </button>
                        `;
                        document.body.appendChild(devHelper);
                        if (window.lucide) lucide.createIcons();
                    }

                    setTimeout(() => {
                        if (!data.devLink) window.location.href = 'login.html';
                    }, 4000);
                } else {
                    showToast(data.error || 'Identity Verification Failed', 'error');
                }
            } catch (err) {
                console.error('API Connection Error:', err);
                showToast('Backend Connection Error!', 'error');
            }
        });
    </script>
</body>
</html>
